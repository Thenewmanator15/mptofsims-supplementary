# Settings for the gitleaks pre-commit check (dev-ops SECURITY-BASELINE.md, section 5).
# All of gitleaks' default rules apply. The allowlist lets through one kind of false
# positive from the history scan of 31 October 2026, and only when the rule, the file
# and the value all match. Anything else in the file is still checked.

# [[allowlists]] with targetRules needs gitleaks 8.25.0 or later.
minVersion = "v8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Measurement-condition names in the beam-averaging data, such as LOC1_withFlangeAttachment"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^beam-averaging/data\.json$''']
regexTarget = "match"
regexes = ['''^key": "LOC[0-9]+_[A-Za-z]+"$''']
